<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Page not found · Quotify</title>
<link rel="canonical" href="https://quotify.to/404.html">
<meta property="og:url" content="https://quotify.to/404.html">
<meta property="og:image" content="https://quotify.to/assets/2/og-image-v2-1200x630.jpg">
<meta name="twitter:image" content="https://quotify.to/assets/2/og-image-v2-1200x630.jpg">
<link rel="icon" href="/assets/2/appicon.png">
<link rel="apple-touch-icon" href="/assets/2/appicon.png">
<style>
:root{
  --bg:#000; --text:#fff; --text2:#a1a1a6; --accent2:#0a84ff;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#fff; --text:#1d1d1f; --text2:#515154; --accent2:#0071e3;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  text-align:center;
  padding:24px;
}
main{max-width:520px}
img{width:72px;height:72px;border-radius:18px;margin:0 auto 22px;display:block}
h1{font-family:ui-serif,"Iowan Old Style",Charter,Georgia,serif;font-size:4.4rem;line-height:1.05;font-weight:900;letter-spacing:-.02em}
p{color:var(--text2);font-size:1.8rem;line-height:1.5;margin-top:14px}
a{display:inline-block;margin-top:28px;background:var(--accent2);color:#fff;font-weight:600;font-size:1.6rem;padding:10px 22px;border-radius:999px;text-decoration:none}
</style>
</head>
<body>
<main>
  <img src="/assets/2/appicon.png" width="512" height="512" alt="">
  <h1>Page not found</h1>
  <p>That page isn’t on Quotify.</p>
  <a href="/">Back to Quotify</a>
</main>
</body>
</html>
